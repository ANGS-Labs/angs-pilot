name: ANGS pilot gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  pilot-baseline:
    name: Pilot baseline
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.0
          check-latest: false
          cache: false

      - name: Run pilot tests
        run: go test ./...

  trusted-evidence:
    name: Trusted evidence
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ANGS-Labs/trusted-workflows/.github/workflows/angs-verify.yml@c53b782c5fd330fcfe8941d3adeb7d2586a1e396
